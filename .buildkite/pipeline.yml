steps:
  - label: ":ruby: Ruby 3.1 Tests"
    key: "ruby-tests"
    command: |
      bundle install
      bundle exec rspec --require spec_helper

  - wait

  - label: ":chart_with_upwards_trend: Coverage Report"
    command: |
      curl https://qlty.sh | sh
      qlty coverage publish coverage/coverage.json
    depends_on: "ruby-tests"
