name: Main
on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - "3.1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run the default task
        run: bundle exec rspec --require spec_helper

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JavaScript dependencies
        run: |
          cd js
          npm ci

      - name: Run JavaScript tests with coverage
        run: |
          cd js
          npm run test:coverage

      - name: Publish Ruby coverage
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/coverage.json
          tag: ruby

      - name: Publish JavaScript coverage
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: js/coverage/lcov.info
          tag: javascript
